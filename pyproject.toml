[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avlokan"
version = "0.1.0"
description = "AVLOKAN satellite imagery intelligence platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]